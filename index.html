<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itsuki · Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script type="module" src="app.js"></script>
</head>
<body>
    <header>
        <h1>❧ Itsuki · Dashboard</h1>
        <div class="status" id="status">conectando…</div>
    </header>

    <main>
        <section class="kpis" id="kpis">
            <div class="kpi"><span class="label">Players</span><span class="value" id="kpi-players">–</span></div>
            <div class="kpi"><span class="label">Wallets</span><span class="value" id="kpi-wallets">–</span></div>
            <div class="kpi"><span class="label">DAU</span><span class="value" id="kpi-dau">–</span></div>
            <div class="kpi"><span class="label">WAU</span><span class="value" id="kpi-wau">–</span></div>
            <div class="kpi"><span class="label">Eventos 24h</span><span class="value" id="kpi-events">–</span></div>
            <div class="kpi"><span class="label">MRR (XTR)</span><span class="value" id="kpi-mrr">–</span></div>
        </section>

        <section class="chart-container">
            <h2>Actividad diaria (30d)</h2>
            <canvas id="chart-daily"></canvas>
        </section>

        <section class="chart-container">
            <h2>Top comandos (7d)</h2>
            <canvas id="chart-commands"></canvas>
        </section>

        <section class="table-container">
            <h2>Top wallets</h2>
            <table id="table-wallets">
                <thead><tr><th>#</th><th>User</th><th>Tokens</th><th>Fichas</th></tr></thead>
                <tbody></tbody>
            </table>
        </section>

        <section class="table-container">
            <h2>Top grupos</h2>
            <table id="table-groups">
                <thead><tr><th>#</th><th>Grupo</th><th>Pts</th><th>Nivel</th><th>ITS</th></tr></thead>
                <tbody></tbody>
            </table>
        </section>

        <footer>
            <span id="last-update">–</span>
            <button id="refresh">🔄 Actualizar</button>
        </footer>
    </main>
</body>
</html>
